name: Build runtime

# Builds the portable Python runtime for Windows and macOS, checks each one on
# a clean machine, and publishes both zips as the "latest" release.
#
# Windows: the official embeddable Python from python.org (signed by the Python
# Software Foundation, nothing to install) with the libraries unpacked next to
# it. macOS: a relocatable standalone Python (python-build-standalone, via uv)
# with the libraries installed into it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Assemble
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The embeddable zip for exactly the version setup-python gave us, so
          # pip below picks wheels for the same Python.
          $ver = python -c "import platform; print(platform.python_version())"
          $tag = python -c "import sys; print('%d%d' % sys.version_info[:2])"
          Write-Host "Python $ver"
          $rt = "ScreeningRuntime"
          Invoke-WebRequest "https://www.python.org/ftp/python/$ver/python-$ver-embed-amd64.zip" -OutFile embed.zip
          Expand-Archive embed.zip -DestinationPath $rt
          # Its ._pth file is its whole sys.path: add site-packages and turn on
          # site (which runs sitecustomize.py).
          $pth = "$rt\python$tag._pth"
          @("python$tag.zip", ".", "Lib\site-packages", "import site") | Set-Content -Encoding ascii $pth
          New-Item -ItemType Directory -Force "$rt\Lib\site-packages" | Out-Null
          python -m pip install --upgrade pip
          python -m pip install --target "$rt\Lib\site-packages" --only-binary=:all: --no-compile -r requirements.txt
          Copy-Item runtime\sitecustomize.py "$rt\Lib\site-packages\"
          Remove-Item -Recurse -Force "$rt\Lib\site-packages\bin" -ErrorAction SilentlyContinue
          "Screening runtime, Python $ver, built $(Get-Date -Format yyyy-MM-dd) from $env:GITHUB_SHA" | Set-Content "$rt\RUNTIME_VERSION.txt"
          python -m pip freeze --path "$rt\Lib\site-packages" | Add-Content "$rt\RUNTIME_VERSION.txt"
          Compress-Archive -Path $rt -DestinationPath ScreeningRuntime-windows-x64.zip
      - name: Check on a clean copy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive ScreeningRuntime-windows-x64.zip -DestinationPath C:\rt-test
          # No help from the runner's own Python: off PATH, and a stray PYTHONHOME
          # or PYTHONPATH must not matter.
          $env:PATH = "C:\Windows\System32;C:\Windows"
          C:\rt-test\ScreeningRuntime\python.exe tests\check_runtime.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The no-console twin the viewers start with.
          $p = Start-Process -Wait -PassThru -FilePath C:\rt-test\ScreeningRuntime\pythonw.exe -ArgumentList '-c "import numpy, scipy, PySide6.QtWidgets"'
          if ($p.ExitCode -ne 0) { Write-Error "pythonw failed: $($p.ExitCode)"; exit 1 }
          Get-Content C:\rt-test\ScreeningRuntime\RUNTIME_VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ScreeningRuntime-windows-x64
          path: ScreeningRuntime-windows-x64.zip

  macos:
    runs-on: macos-latest        # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Assemble
        run: |
          set -euo pipefail
          uv python install 3.13 --install-dir pbs
          PYDIR="$(ls -d pbs/cpython-3.13*)"
          mv "$PYDIR" ScreeningRuntime
          PY=ScreeningRuntime/bin/python3
          "$PY" --version
          rm -f ScreeningRuntime/lib/python3.13/EXTERNALLY-MANAGED
          "$PY" -m ensurepip --upgrade >/dev/null 2>&1 || true
          "$PY" -m pip install --only-binary=:all: --no-compile -r requirements.txt
          cp runtime/sitecustomize.py ScreeningRuntime/lib/python3.13/site-packages/
          { echo "Screening runtime, $("$PY" --version), built $(date +%F) from $GITHUB_SHA"; "$PY" -m pip freeze; } > ScreeningRuntime/RUNTIME_VERSION.txt
          ditto -c -k --keepParent ScreeningRuntime ScreeningRuntime-macos-arm64.zip
      - name: Check on a clean copy
        run: |
          set -euo pipefail
          mkdir -p /tmp/rt-test && ditto -x -k ScreeningRuntime-macos-arm64.zip /tmp/rt-test
          # Somewhere else entirely, with no other Python on PATH.
          env -i HOME="$HOME" PATH=/usr/bin:/bin /tmp/rt-test/ScreeningRuntime/bin/python3 tests/check_runtime.py
          cat /tmp/rt-test/ScreeningRuntime/RUNTIME_VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ScreeningRuntime-macos-arm64
          path: ScreeningRuntime-macos-arm64.zip

  release:
    # Publishes whichever builds passed: a failed macOS build doesn't hold up
    # Windows.
    needs: [windows, macos]
    if: ${{ always() && (needs.windows.result == 'success' || needs.macos.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete latest --cleanup-tag -y || true
          gh release create latest ScreeningRuntime-*.zip \
            --title "Screening runtime (latest)" --target "$GITHUB_SHA" \
            --notes "Portable Python with every library the Balance Check and Sharps Screening Tool need. Unzip next to the tools; see the README."
